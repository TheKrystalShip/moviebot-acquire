# Builds the moviebot-acquire CLI and publishes it as a GitHub release.
#
# Pushing a tag v<version> publishes that version; the tag must match the newest entry in
# CHANGELOG.md. Running the workflow by hand builds the same archive and keeps it as a run
# artifact without publishing anything.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          version="$(scripts/version.sh)"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CHANGELOG.md, which is at $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test moviebot-acquire.slnx -c Release --nologo

      - name: Package
        run: scripts/package-release.sh "$GITHUB_WORKSPACE/out"

      # The release notes are this version's CHANGELOG entry.
      - name: Write the release notes
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " v "$" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "moviebot-acquire ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            out/moviebot-acquire-linux-x64.tar.gz out/moviebot-acquire-linux-x64.tar.gz.sha256

      - name: Keep the archive as a run artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: moviebot-acquire-linux-x64
          path: |
            out/moviebot-acquire-linux-x64.tar.gz
            out/moviebot-acquire-linux-x64.tar.gz.sha256
            notes.md
